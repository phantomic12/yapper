<!DOCTYPE html>
<html><head><title>test</title></head><body>
<div id="result">running...</div>
<script>
(async () => {
  const out = document.getElementById('result');
  try {
    const r = await fetch('https://huggingface.co/KittenML/kitten-tts-nano-0.8-int8/resolve/main/voices.npz', { redirect: 'follow' });
    out.textContent = `status=${r.status} bytes=${(await r.arrayBuffer()).byteLength}`;
  } catch (e) {
    out.textContent = `ERROR: ${e.message}`;
  }
})();
</script>
</body></html>
